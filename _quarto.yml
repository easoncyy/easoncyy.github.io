project:
  type: website
  output-dir: _site
  pre-render:
    - python scripts/render-log.py
    - python scripts/render-library.py
  render:
    - index.qmd
    - blog.qmd
    - about.qmd
    - projects.qmd
    - links.qmd
    - log.qmd
    - library.qmd
    - "posts/**/*.qmd"
  resources:
    - assets/
    - .nojekyll

website:
  title: "个人笔记"
  site-url: "https://easoncyy.github.io"
  description: "记录学习、代码与思考。"
  favicon: assets/favicon.svg
  navbar:
    title: "~/notes"
    logo: assets/logo.svg
    logo-alt: "Ce · easoncyy"
    background: white
    foreground: black
    left:
      - href: blog.qmd
        text: "<span class='nav-path'>blog/</span><span class='nav-caption'>博客</span>"
      - href: projects.qmd
        text: "<span class='nav-path'>projects/</span><span class='nav-caption'>项目</span>"
      - href: log.qmd
        text: "<span class='nav-path'>log/</span><span class='nav-caption'>日志</span>"
      - href: links.qmd
        text: "<span class='nav-path'>links/</span><span class='nav-caption'>友链</span>"
      - href: library.qmd
        text: "<span class='nav-path'>library/</span><span class='nav-caption'>图书馆</span>"
      - href: about.qmd
        text: "<span class='nav-path'>about/</span><span class='nav-caption'>关于</span>"
  search:
    location: navbar
    type: overlay
  page-footer:
    left: "[~/notes](index.qmd) · 记录与探索"
    right: |
      <a class="footer-repository" href="https://github.com/easoncyy/easoncyy.github.io" target="_blank" rel="noopener noreferrer" aria-label="查看本站 GitHub 仓库"><i class="bi bi-github" aria-hidden="true"></i><span>source/</span></a><span class="footer-builder">Built with Quarto</span>

lang: zh-CN
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-title: 本页目录
    anchor-sections: true
    html-math-method: mathjax
    code-copy: true
    highlight-style: monochrome
    smooth-scroll: true
    include-in-header:
      text: '<script defer src="/assets/directory.js"></script>'

