project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - blog.qmd
    - about.qmd
    - projects.qmd
    - links.qmd
    - "posts/**/*.qmd"
  resources:
    - assets/
    - .nojekyll

website:
  title: "个人笔记"
  site-url: "https://easoncyy.github.io"
  description: "记录学习、代码与思考。"
  navbar:
    title: "~/notes"
    background: white
    foreground: black
    left:
      - href: blog.qmd
        text: "<span class='nav-path'>blog/</span><span class='nav-caption'>博客</span>"
      - href: projects.qmd
        text: "<span class='nav-path'>projects/</span><span class='nav-caption'>项目</span>"
      - href: links.qmd
        text: "<span class='nav-path'>links/</span><span class='nav-caption'>友链</span>"
      - href: about.qmd
        text: "<span class='nav-path'>about/</span><span class='nav-caption'>关于</span>"
  search:
    location: navbar
    type: overlay
  page-footer:
    left: "[~/notes](index.qmd) · 记录与探索"
    right: "Built with Quarto"

lang: zh-CN
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-title: 本页目录
    anchor-sections: true
    html-math-method: mathjax
    code-copy: true
    highlight-style: monochrome
    smooth-scroll: true
    include-in-header:
      text: '<script defer src="/assets/directory.js"></script>'

